<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#18181c}</style></head><body><canvas id="c"></canvas>
<script type="module">
// Costume lineup sheet: every S02 costume drawn with its pose, labelled, grouped in rows. Rendered by render-lineup.mjs.
import { drawPerson, DEFAULT_POSE } from '/src/draw.js';
import { POSES } from '/src/stage.js';
import { S02_COSTUMES, LINEUP } from '/content/s02-cast.mjs';
const CW = 360, CH = 560, TOP = 120, ROWH = CH + 116, COLS = Math.max(...LINEUP.map((r) => r[1].length));
const cv = document.getElementById('c'); cv.width = 40 + COLS * CW; cv.height = TOP + LINEUP.length * ROWH + 20; const k = cv.getContext('2d');
k.fillStyle = '#18181c'; k.fillRect(0, 0, cv.width, cv.height);
k.fillStyle = '#f0f0f0'; k.font = 'bold 44px "DejaVu Sans"'; k.fillText('S02 Ice King · Round 0 costume lineup (art brief section 2)', 24, 58);
k.fillStyle = '#b0b0b0'; k.font = '22px "DejaVu Sans"'; k.fillText('Same flat white faces for everyone: identity is in the clothes. Eddie keeps his sneakers. No bowlers in 1806/1833. Adults only on the ice.', 24, 96);
const merge = (b, q) => { const p = { ...b, ...q }; for (const x of ['armL', 'armR', 'legL', 'legR']) p[x] = { ...b[x], ...(q[x] || {}) }; return p; };
LINEUP.forEach(([title, ids], ri) => {
  const y0 = TOP + ri * ROWH;
  k.fillStyle = '#26262c'; k.fillRect(16, y0, cv.width - 32, ROWH - 16);
  k.fillStyle = '#e8c55a'; k.font = 'bold 26px "DejaVu Sans"'; k.fillText(title, 32, y0 + 34);
  ids.forEach((id, i) => {
    const d = S02_COSTUMES[id]; const x = 40 + i * CW;
    const g = k.createLinearGradient(0, y0 + 50, 0, y0 + 50 + CH); g.addColorStop(0, '#e9e2d2'); g.addColorStop(1, '#cfc6b2'); k.fillStyle = g; k.fillRect(x, y0 + 50, CW - 20, CH); k.save(); k.beginPath(); k.rect(x, y0 + 50, CW - 20, CH); k.clip();
    k.fillStyle = 'rgba(0,0,0,.25)'; k.beginPath(); k.ellipse(x + (CW - 20) / 2, y0 + 50 + CH - 40, 80, 16, 0, 0, 7); k.fill();
    const pose = merge(DEFAULT_POSE, POSES[d.pose] || {}); pose.dir = 1; pose.shake = 0; pose.turn = 0.15;
    k.save(); k.translate(x + (CW - 20) / 2, y0 + 50 + CH - 40); k.scale(0.6, 0.6);
    drawPerson(k, { ...d.c, dir: 1 }, pose, null); k.restore(); k.restore();
    k.fillStyle = '#f0f0f0'; k.font = '19px "DejaVu Sans"'; const words = d.label; k.fillText(words.length > 34 ? words.slice(0, 34) + '…' : words, x, y0 + 50 + CH + 30);
  });
});
window.ready = true;
</script></body></html>
